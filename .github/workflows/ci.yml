name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        # Windows too: the plugin is developed on both, and path and line-ending bugs show up only there.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm test
